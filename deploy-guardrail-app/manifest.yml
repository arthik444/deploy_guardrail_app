modules:
  jira:workflowValidator:
    - key: deploy-guardrail-validator
      function: validateDeployment
      name: Deploy Guardrail Validator
      description: Blocks deployment if risk score is too high.
  jira:issuePanel:
    - key: deploy-guardrail-app-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: deploy-guardrail-app
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
    - key: validateDeployment
      handler: index.validateDeployment
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
    - storage:app
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/6067b673-845f-4db8-a7ec-34c5e59e94ed
